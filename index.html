<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="title-header">
        <h1 class="game-title">
            Rock Paper Scissor Game
        </h1>
    </header>
    <section class="main-body">
        <div class="img-box">
            <div class="choice" id="rock">
                <img src="rock.png" alt="Rock" class="rock g-img">
            </div>
            <div class="choice" id="paper">
                <img src="paper.png" alt="paper" class="paper g-img">
            </div>
            <div class="choice" id="scissor">
                <img src="scissor.png" alt="scissor" class="scissor g-img">
            </div>
        </div>
        <div class="result-box">
            <div class="you-box">
                <p class="your-score">0</p>
                <p>You</p>
            </div>
            <div class="computer-box">
                <p class="comp-score">0</p>
                <p>Computer</p>
            </div>
        </div>
        <div class="massage-box">
            <p class="massage">
                pick your move
            </p>
        </div>
    </section>
    <footer class="footer">
        <p> All Rights Are Reserved <span class="currentyear"></span> </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
